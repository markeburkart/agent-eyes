[project]
name = "agent-eyes"
version = "0.1.0"
description = "Hands-free voice and vision assistant for the workbench"
authors = [
    { name = "Mark Burkart", email = "markeburkart@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.166",
    "httpx>=0.28.1",
]

[project.scripts]
agent-eyes = "agent_eyes.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
